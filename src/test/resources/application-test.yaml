spring:
  datasource:
    url: jdbc:h2:mem:adventure-test;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  flyway:
    enabled: false

logging:
  level:
    org.hibernate.SQL: WARN

app:
  jwt:
    secret: test-secret-that-is-definitely-longer-than-thirty-two-characters
    expiration-seconds: 3600
